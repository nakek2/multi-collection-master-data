name: マスタ情報源の更新チェック

# 毎週月曜日 09:00 JST (00:00 UTC) に自動実行。
# 手動実行(workflow_dispatch)にも対応(動作確認用)。
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

# monitor_state.json をリポジトリへコミットし戻すため、書き込み権限が必要。
permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install requests

      - name: 監視スクリプトを実行
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/monitor_master_sources.py

      - name: 状態ファイルの変更をコミット
        run: |
          git config user.name "master-source-monitor-bot"
          git config user.email "actions@github.com"
          git add scripts/monitor_state.json
          git diff --cached --quiet || git commit -m "chore: マスタ情報源の監視状態を更新"
          git push
